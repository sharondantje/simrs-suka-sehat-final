<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kasir / Billing - RS Suka Sehat</title>
<style>
:root{--p:#0D6E6E;--p2:#0A4D68;--bg:#F3FAFC;--line:#D6E8EE;--text:#164E63;--muted:#66869A}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px}.app{display:flex;min-height:100vh}.side{width:216px;background:white;border-right:1px solid var(--line);padding:18px 12px;position:fixed;inset:0 auto 0 0}.brand{font-weight:800;color:var(--p2);font-size:16px;margin:0 8px 22px}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:3px}.nav{display:block;width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;margin:3px 0;border-radius:8px;color:#456D7D;cursor:pointer}.nav.active,.nav:hover{background:#EAF6F8;color:var(--p);font-weight:700}.main{margin-left:216px;flex:1}.top{height:60px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.content{padding:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 3px 10px rgba(15,116,144,.04)}.kpi small{color:var(--muted)}.kpi b{display:block;font-size:20px;margin-top:8px;color:var(--p2)}h1{font-size:22px;margin:0 0 5px}h2{font-size:15px;margin:0 0 14px}.sub{color:var(--muted);margin-bottom:20px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eef2f5;text-align:left;font-size:12px}th{background:#F7FBFC;color:var(--muted)}.badge{padding:4px 8px;border-radius:999px;font-size:10px}.ok{background:#D9F3EA;color:#117A68}.pending{background:#FFF0D5;color:#A66700}.cicilan{background:#E1EEFB;color:#1D5FA8}.btn{border:0;border-radius:7px;padding:8px 11px;cursor:pointer}.primary{background:var(--p);color:#fff}.tabs{display:flex;gap:8px;margin-bottom:14px}.hidden{display:none}.filters{display:flex;gap:10px;margin-bottom:14px}.filters input,.filters select{padding:9px;border:1px solid var(--line);border-radius:7px}.invoice{max-width:760px;margin:auto}.invoice-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
<!-- SIMRS: tema seragam portal (font, warna, ukuran) -->
<script>document.documentElement.dataset.simrsMod="kasir";if(window.top!==window.self)document.documentElement.classList.add("embedded-simrs-module");</script>
<link rel="stylesheet" id="simrs-module-theme" href="../../assets/module-theme.css">
</head><body><div class="app"><aside class="side"><div class="brand">RS Suka Sehat<small>Kasir / Billing</small></div><button class="nav active" data-v="dashboard" onclick="show('dashboard',this)">📊 Dashboard</button><button class="nav" data-v="rekap" onclick="show('rekap',this)">📋 Rekapitulasi Biaya</button><button class="nav" data-v="riwayat" onclick="show('riwayat',this)">🗂 Riwayat Transaksi</button><button class="nav" data-v="invoice" onclick="show('invoice',this)">🖨 Cetak Invoice</button></aside><main class="main"><header class="top"><b>Kasir / Billing</b><div><b>Dewi Rahayu, S.E.</b> · Keuangan</div></header><div class="content" id="content"></div></main></div>
<script>
const txs=[
{id:'TRX-2026-0091',rm:'RM-2026-000219',name:'Herman Suryadi',module:'Rawat Inap',total:36000000,covered:30000000,share:6000000,paid:6000000,method:'Transfer Bank',status:'lunas',invoice:'INV-2026-0091'},
{id:'TRX-2026-0092',rm:'RM-2026-000205',name:'Maya Putri',module:'Rawat Jalan',total:220000,covered:0,share:220000,paid:0,method:'-',status:'pending',invoice:'INV-2026-0092'},
{id:'TRX-2026-0093',rm:'RM-2026-000201',name:'Rina Wulandari',module:'Rawat Jalan',total:615000,covered:615000,share:0,paid:615000,method:'BPJS',status:'lunas',invoice:'INV-2026-0093'},
{id:'TRX-2026-0094',rm:'RM-2026-000221',name:'Bambang Irawan',module:'Rawat Inap',total:5020000,covered:3500000,share:1520000,paid:760000,method:'Tunai',status:'cicilan',invoice:'INV-2026-0094'},
{id:'TRX-2026-0095',rm:'RM-2026-000222',name:'Wati Susanti',module:'Rawat Inap',total:6500000,covered:6500000,share:0,paid:6500000,method:'BPJS',status:'lunas',invoice:'INV-2026-0095'},
{id:'TRX-2026-0096',rm:'RM-2026-000224',name:'Ahmad Rizal',module:'IGD',total:750000,covered:0,share:750000,paid:750000,method:'QRIS',status:'lunas',invoice:'INV-2026-0096'}];
const rp=n=>'Rp '+Number(n).toLocaleString('id-ID'); const badge=s=>`<span class="badge ${s}">${s==='lunas'?'Lunas':s==='pending'?'Pending':'Cicilan'}</span>`;
function rows(list=txs){return list.map(t=>`<tr><td>${t.id}</td><td>${t.name}<br><small>${t.rm}</small></td><td>${t.module}</td><td>${rp(t.total)}</td><td>${rp(t.share)}</td><td>${badge(t.status)}</td><td>${t.status!=='lunas'?`<button class="btn primary" onclick="pay('${t.id}')">Proses Bayar</button>`:`<button class="btn" onclick="invoice('${t.id}')">Invoice</button>`}</td></tr>`).join('')}
function show(v,btn){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active')); if(btn)btn.classList.add('active'); const c=document.getElementById('content');
if(v==='dashboard'){let income=txs.filter(x=>x.status==='lunas').reduce((a,b)=>a+b.paid,0),pending=txs.filter(x=>x.status==='pending').length,total=txs.reduce((a,b)=>a+b.total,0),bpjs=txs.reduce((a,b)=>a+b.covered,0);c.innerHTML=`<h1>Dashboard Kasir</h1><div class="sub">Ringkasan transaksi dan antrian pembayaran</div><div class="grid"><div class="card kpi"><small>Pendapatan Hari Ini</small><b>${rp(income)}</b></div><div class="card kpi"><small>Menunggu Pembayaran</small><b>${pending} pasien</b></div><div class="card kpi"><small>Klaim BPJS/Asuransi</small><b>${rp(bpjs)}</b></div><div class="card kpi"><small>Total Tagihan</small><b>${rp(total)}</b></div></div><div class="card" style="margin-top:16px"><h2>Antrian Pembayaran</h2><table><thead><tr><th>Transaksi</th><th>Pasien</th><th>Modul</th><th>Total</th><th>Tanggungan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows(txs.filter(x=>x.status!=='lunas'))}</tbody></table></div>`}
if(v==='rekap'){c.innerHTML=`<h1>Rekapitulasi Biaya</h1><div class="sub">Rekap biaya berdasarkan unit pelayanan</div><div class="card"><table><thead><tr><th>Unit</th><th>Jumlah Transaksi</th><th>Total Tagihan</th><th>Ditanggung</th><th>Pasien</th></tr></thead><tbody>${['Rawat Inap','Rawat Jalan','IGD'].map(m=>{let a=txs.filter(x=>x.module===m);return `<tr><td>${m}</td><td>${a.length}</td><td>${rp(a.reduce((s,x)=>s+x.total,0))}</td><td>${rp(a.reduce((s,x)=>s+x.covered,0))}</td><td>${rp(a.reduce((s,x)=>s+x.share,0))}</td></tr>`}).join('')}</tbody></table></div>`}
if(v==='riwayat'){c.innerHTML=`<h1>Riwayat Transaksi</h1><div class="sub">Pencarian dan status seluruh transaksi</div><div class="filters"><input id="q" placeholder="Cari pasien / RM / transaksi" oninput="filterRows()"><select id="st" onchange="filterRows()"><option value="">Semua status</option><option value="lunas">Lunas</option><option value="pending">Pending</option><option value="cicilan">Cicilan</option></select></div><div class="card"><table><thead><tr><th>Transaksi</th><th>Pasien</th><th>Modul</th><th>Total</th><th>Tanggungan</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="tbody">${rows()}</tbody></table></div>`}
if(v==='invoice'){invoice('TRX-2026-0091')}}
function filterRows(){let q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('st').value;document.getElementById('tbody').innerHTML=rows(txs.filter(t=>(!q||(`${t.id} ${t.rm} ${t.name}`).toLowerCase().includes(q))&&(!s||t.status===s)))}
function pay(id){let t=txs.find(x=>x.id===id);let method=prompt('Metode pembayaran: Tunai / Transfer Bank / QRIS','Tunai');if(!method)return;t.paid=t.share;t.method=method;t.status='lunas';alert('Pembayaran berhasil dicatat. Invoice siap dicetak.');show('dashboard',document.querySelector('[data-v=dashboard]'))}
function invoice(id){let t=txs.find(x=>x.id===id)||txs[0];document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.querySelector('[data-v=invoice]').classList.add('active');document.getElementById('content').innerHTML=`<div class="card invoice"><h1>Invoice ${t.invoice}</h1><div class="sub">RS Suka Sehat · Kasir / Billing</div><div class="invoice-row"><span>Pasien</span><b>${t.name}</b></div><div class="invoice-row"><span>No. RM</span><b>${t.rm}</b></div><div class="invoice-row"><span>Unit</span><b>${t.module}</b></div><div class="invoice-row"><span>Total Tagihan</span><b>${rp(t.total)}</b></div><div class="invoice-row"><span>Ditanggung</span><b>${rp(t.covered)}</b></div><div class="invoice-row"><span>Tanggungan Pasien</span><b>${rp(t.share)}</b></div><div class="invoice-row"><span>Metode Bayar</span><b>${t.method}</b></div><div class="invoice-row"><span>Status</span><b>${badge(t.status)}</b></div><button class="btn primary" style="margin-top:18px" onclick="window.print()">🖨 Cetak Invoice</button></div>`}
show('dashboard',document.querySelector('[data-v=dashboard]'));
</script></body></html>
